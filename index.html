<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Mentor | Order Summary</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Red Hat Display", sans-serif;
      }
    </style>
  </head>

  <body>
    <main
      class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#e0e8ff] px-4 py-10"
    >
      <img
        src="images/pattern-background-desktop.svg"
        alt=""
        class="pointer-events-none absolute left-0 top-0 w-full"
      />

      <section
        class="relative z-10 w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-xl"
      >
        <img
          src="images/illustration-hero.svg"
          alt=""
          class="block h-auto w-full"
        />

        <div class="px-6 py-8 sm:px-10">
          <h1 class="text-center text-2xl font-black text-[#1f2f56]">
            Order Summary
          </h1>

          <p
            class="mt-4 text-center text-base font-medium leading-6 text-[#7280a7]"
          >
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>

          <div
            class="mt-6 flex items-center justify-between gap-3 rounded-xl bg-[#f5f7ff] p-4"
          >
            <div class="flex min-w-0 items-center gap-4">
              <img
                src="images/icon-music.svg"
                alt=""
                class="h-12 w-12 shrink-0"
              />

              <div>
                <h2 class="font-bold text-[#1f2f56]">Annual Plan</h2>

                <p class="text-sm font-medium text-[#7280a7]">$59.99/year</p>
              </div>
            </div>

            <a
              href="#"
              class="shrink-0 text-sm font-bold text-[#3829e0] underline hover:no-underline"
            >
              Change
            </a>
          </div>

          <div class="mt-8 flex flex-col gap-4">
            <button
              type="button"
              class="w-full rounded-xl bg-[#3829e0] px-4 py-4 font-bold text-white shadow-lg shadow-indigo-200 hover:bg-[#766cf1] focus:outline-2 focus:outline-offset-2 focus:outline-[#3829e0]"
            >
              Proceed to Payment
            </button>

            <button
              type="button"
              class="w-full rounded-xl px-4 py-3 font-bold text-[#7280a7] hover:text-[#1f2f56] focus:outline-2 focus:outline-offset-2 focus:outline-[#3829e0]"
            >
              Cancel Order
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
